<script>
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ru-RU').replace(/\u00a0/g,' ')+' ₽';
const L='АВЕКМНОРСТУХ';
const RAR=[{n:'Обычный',c:'#9aa0b8',v:300},{n:'Редкий',c:'#4aa3ff',v:3000},{n:'Эпик',c:'#b066ff',v:30000},{n:'Легенда',c:'#ffb020',v:500000},{n:'Мифик',c:'#ff4d6d',v:5000000},{n:'Секретный',c:'#19e6d0',v:50000000},{n:'Абсолютный',c:'#ffffff',v:2500000000}];
const BETS=[{n:'Обычная крутка',p:1000,m:1,pm:1,d:'любой номер · лега ≈1 из 5 000 · мифик ≈1 из 50 000'},{n:'Премиум крутка',p:5000,m:3,pm:2,d:'цены ×3 · мифик и секретка ×2 чаще'},{n:'Элитная крутка',p:27777,m:12,pm:2.7,d:'цены ×12 · мифик и секретка ×2,7 чаще'}];
const COUNTRIES={RU:{f:'🇷🇺',n:'Россия'},BY:{f:'🇧🇾',n:'Беларусь'},KZ:{f:'🇰🇿',n:'Казахстан'},US:{f:'🇺🇸',n:'США'}};
const TYPES={civil:'Гражданский',taxi:'Такси',police:'Полиция',mil:'Военный',dip:'Дипломатический',moto:'Мотоцикл'};
const REGIONS=[['777',2.3],['77',1.6],['177',1.6],['199',1.6],['88',1.2],['97',1.5],['99',1.5],['197',1.5],['799',1.5],['977',1.2],['78',1.4],['98',1.2],['178',1.4],['198',1.2],['11',1.3],['22',1.3],['33',1.3],['44',1.3],['55',1.3],['66',1.3],['01',1.2],['02',1.2],['03',1.2],['50',1.2],['52',1.2],['116',1.4],['123',1.4],['161',1.2]];

let S={bal:5000000,xp:0,lvl:1,streak:1,type:'civil',country:'RU',region:null,bet:0,inv:[],hist:[],daily:0,free:0,luck:0,show:[],spins:0,bp:0,gc:0,ach:[]};
try{const x=localStorage.getItem('namerok');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{S.ts=Date.now();try{localStorage.setItem('namerok',JSON.stringify(S))}catch(e){}try{cloud()}catch(e){}};
const rnd=n=>Math.floor(Math.random()*n);
const pick=s=>s[rnd(s.length)];
const D=()=>rnd(10);

function cost(){if(S.free>0&&S.bet===0&&!S.region)return 0;const b=BETS[S.bet];let c=b.p;if(S.region){const r=REGIONS.find(x=>x[0]===S.region);c=c*1.2*(r?r[1]/1.2:1)}return Math.round(c)}

function rollRarity(){if(S.force!=null&&S.force>=0){const f=S.force;S.force=null;return f}
 const b=BETS[S.bet],r=Math.random();
 const lk=(Date.now()<S.luck?2:1)*(S.lm||1)*(CFG.lm||1);const pm=b.pm*lk,pl=b.pm*(S.bet?1.6:1)*lk;
 if(r<pm/2e7)return 6;if(r<pm/5e5)return 5;if(r<pm/50000)return 4;
 if(r<pm/50000+pl/5000)return 3;
 if(r<0.005*(S.bet+1)+0.0002*pl*0)return 2;
 if(r<0.05*(S.bet+1)+0.01)return 2*0+(Math.random()<.18?2:1);
 return 0;
}
function digits3(rar){
 if(rar>=6)return '777';if(rar===5)return '001';if(rar>=3){const d=D();return ''+d+d+d}
 if(rar===2){const a=1+rnd(9);return Math.random()<.5?a+'00':''+a+0+a}
 if(rar===1){const a=rnd(8);return Math.random()<.5?''+a+(a+1)+(a+2):''+a+D()+a}
 let s;do{s=''+D()+D()+D()}while(s[0]===s[1]||s[1]===s[2]||s[0]===s[2]);return s}
function letters(rar,n){
 if(rar>=4){const l=pick(L);return l.repeat(n)}
 if(rar===3)return Array.from({length:n},()=>pick(L)).join('');
 return Array.from({length:n},()=>pick(L)).join('')}
function genPlate(rar){
 const reg=rar>=6?'777':rar===5?'99':S.region||pick(['77','78','50','52','116','161','23','63','02','199','177','197']);
 const t=S.type;

function cine(rar,num){const o=document.createElement('div');o.className='cine c'+rar;o.innerHTML='<div class="rays"></div><i class="ring"></i><i class="ring r2"></i><i class="ring r3"></i><div class="ct">'+(rar>=6?'АБСОЛЮТ':'СЕКРЕТ')+'</div><div class="cs">'+esc(num)+'</div><div style="position:absolute;bottom:40px;font-size:13px;opacity:.7">⏭ Нажми, чтобы пропустить</div>';for(let i=0;i<(rar>=6?60:40);i++){const s=document.createElement('b');s.style.cssText='left:'+Math.random()*100+'%;font-size:'+(10+Math.random()*16)+'px;animation-delay:'+Math.random()*1.5+'s;animation-duration:'+(1.5+Math.random()*2)+'s';s.textContent=rar>=6?'✦':(Math.random()<.5?'0':'1');o.appendChild(s)}o.onclick=()=>o.remove();document.body.appendChild(o);setTimeout(()=>o.remove(),rar>=6?4200:3000);try{navigator.vibrate&&navigator.vibrate(rar>=6?[80,60,80,60,300]:[60,40,60])}catch(e){}}
function boom(c){const d=document.createElement('div');d.className='boom';for(let i=0;i<28;i++){const s=document.createElement('i');s.style.cssText='--x:'+((Math.random()-.5)*360)+'px;--y:'+(-Math.random()*320-40)+'px;background:'+c+';left:50%;top:45%;animation-delay:'+(Math.random()*.15)+'s';d.appendChild(s)}document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function welcome(){open(`<h2>Добро пожаловать в нАмерок</h2><p>Крути номера, собирай редкие, продавай на рынке и поднимайся в топе.</p><input class="inp" id="wn" maxlength="14" placeholder="Придумай ник" value="${esc(S.nick||'')}"><div class="inv"><span>🎰</span><span class="mp">Нажми «Крутить» — номер выпадает случайно</span></div><div class="inv"><span>💎</span><span class="mp">Дороже ставка — выше шанс на легенду и мифик</span></div><div class="inv"><span>🏪</span><span class="mp">${SRV==='on'?'Рынок и топ общие для всех игроков':'Прогресс хранится в этом браузере. Открой игру через Telegram, чтобы играть вместе со всеми'}</span></div><button class="cl" id="wgo">Играть</button>`);$('wgo').onclick=()=>{S.nick=$('wn').value.trim().slice(0,14)||S.nick;S.seen=1;save();if(initData)act('prefs',{nick:S.nick,seen:1});close()}}
setInterval(()=>{const d=$('srvd');if(d)d.textContent=SRV==='on'?'🟢':SRV==='err'?'🟠':'⚪'},2000);
function fmtT(ms){const s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}
setInterval(()=>{const e=$('luckT'),r=(S.luck||0)-T();e.textContent='🍀 Удача ×2 · '+(r>0?fmtT(r):'не активна');e.style.opacity=r>0?1:.55},1000);
$('luckT').onclick=()=>A.shop();
srvInit().finally(()=>{if(!S.seen)welcome()});$('bReg').onclick=()=>{if(S.country!=='RU'){toast('Регион выбирается только для России');return}sRegion()};
$('aGar').onclick=()=>{LASTI=null;showAct();toast('Номер отложен в инвентарь')};$('skipBtn').onclick=()=>{SKIP=true};$('bType').onclick=sType;$('bCountry').onclick=sType;$('bBet').onclick=sBet;$('bInv').onclick=sInv;$('bDaily').onclick=()=>initData?act('daily',{}):daily();
ui();
</script>
</body>
</html>
